<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="icon" href="data:">
<title>ドラムロール</title>
</head><body>
<button id="btn" class="btn">タップでドラムロール</button>

<div class="note">
  Sound: <a href="https://freesound.org/people/MissloonerVoiceOver255/sounds/569113/" target="_blank" rel="noopener">Freesound - Long Snare Drum Roll with Cymbal Crash.mp3 by MissloonerVoiceOver255</a><br>
  App: <a href=https://github.com/code4fukui/drumroll/>src on GitHub</a><br>
</div>

<script type="module">
const audio = new Audio();
audio.src = "569113__missloonervoiceover255__long-snare-drum-roll-with-cymbal-crash.mp3";
btn.onclick = () => {
  if (!audio.paused) {
    // 再生中なら停止
    audio.pause();
    audio.currentTime = 0; // 頭に戻す
  } else {
    // 停止中なら最初から再生
    audio.currentTime = 0;
    audio.play();
  }
};
</script>
